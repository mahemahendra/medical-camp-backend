# Medical Camp Manager - Nginx Configuration for GCP VM
# This config serves both frontend (static) and backend (reverse proxy)
#
# Installation:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/medical-camp
#   sudo ln -sf /etc/nginx/sites-available/medical-camp /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_VM_IP with the actual external IP of your GCP e2-micro instance

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Client body size (for file uploads — 10MB max per file, 50MB total)
    client_max_body_size 60m;

    # ─── API Backend (reverse proxy to Node.js) ───
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Health check endpoint ───
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Uploaded files (local storage mode) ───
    # If using GCS, these are served from storage.googleapis.com directly
    location /uploads/ {
        alias /home/app/medical-camp-backend/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Access-Control-Allow-Origin "*";

        # MIME types for uploaded files
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            application/pdf pdf;
        }
    }

    # ─── Frontend (static files from Vite build) ───
    location / {
        root /home/app/medical-camp-frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Deny access to hidden files ───
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
